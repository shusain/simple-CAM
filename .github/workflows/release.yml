name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build application
        run: npm run build

      - name: Prepare release archives
        id: package_release
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          RELEASE_DIR="release-artifacts"
          mkdir -p "${RELEASE_DIR}"

          zip -r "${RELEASE_DIR}/simple-cam-${VERSION}-renderer-dist.zip" dist
          zip -r "${RELEASE_DIR}/simple-cam-${VERSION}-electron-dist.zip" dist-electron

          (
            cd "${RELEASE_DIR}"
            sha256sum ./*.zip > SHA256SUMS.txt
          )

          if [[ "${TAG_NAME}" =~ -(alpha|beta|rc)(\.[0-9]+)?$ ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: release-artifacts
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.package_release.outputs.prerelease }}
          generate_release_notes: true
          files: |
            release-artifacts/simple-cam-*-renderer-dist.zip
            release-artifacts/simple-cam-*-electron-dist.zip
            release-artifacts/SHA256SUMS.txt
