kind: pipeline
type: docker
name: default

clone:
  disable: true

steps:
- name: custom_clone
  image: alpine/git:latest
  commands:
  - >
    url="http://gitea.shaun-husain.com:3000/${DRONE_REPO}.git";
    git clone "$url" .;
    git checkout "$DRONE_COMMIT_SHA"

- name: verify
  image: node:24-alpine
  commands:
  - npm ci
  - npm run typecheck
  - npm run test:coverage
  - npm run build
  when:
    event:
    - push
    - pull_request

- name: docker
  image: plugins/docker
  settings:
    repo: registry.shaun-husain.com/simple-cam
    tags:
    - ${DRONE_BUILD_NUMBER}
    - latest
    registry: registry.shaun-husain.com
    dockerfile: Dockerfile
    insecure: true
    purge: false
  when:
    branch:
    - main
    event:
    - push

- name: kubectl_apply
  image: bitnami/kubectl:latest
  environment:
    KUBECONFIG: /.kube/config
  volumes:
  - name: kubeconfig
    path: /.kube/config
  commands:
  - NS="${K8S_NAMESPACE:-automation}"; kubectl get ns "$NS" || kubectl create ns "$NS"
  - NODE="$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')"; kubectl wait --for=condition=Ready "node/$NODE" --timeout=30s
  - kubectl apply -f k8s/
  - NS="${K8S_NAMESPACE:-automation}"; kubectl delete pod -n "$NS" -l app=simple-cam --wait=true --ignore-not-found=true
  - NS="${K8S_NAMESPACE:-automation}"; until kubectl get pod -n "$NS" -l app=simple-cam --no-headers 2>/dev/null | grep -q .; do sleep 2; done
  - NS="${K8S_NAMESPACE:-automation}"; kubectl wait --for=condition=Ready pod -n "$NS" -l app=simple-cam --timeout=60s || (kubectl get node -o wide && echo --- && kubectl describe deploy/simple-cam -n "$NS" && echo --- && kubectl get rs,pod -n "$NS" -l app=simple-cam -o wide && echo --- && kubectl describe pod -n "$NS" -l app=simple-cam && echo --- && kubectl get events -n "$NS" --sort-by=.metadata.creationTimestamp | tail -n 120 && exit 1)
  - NS="${K8S_NAMESPACE:-automation}"; kubectl get deploy,rs,svc,ingress,pods -n "$NS" -o wide
  when:
    branch:
    - main
    event:
    - push

volumes:
- name: kubeconfig
  host:
    path: /home/shaun/.kube/config
