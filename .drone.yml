kind: pipeline
type: docker
name: default

clone:
  disable: true

steps:
- name: custom_clone
  image: alpine/git:latest
  commands:
  - >
    url="http://gitea.shaun-husain.com:3000/${DRONE_REPO}.git";
    git clone "$url" .;
    git checkout "$DRONE_COMMIT_SHA"

- name: verify
  image: node:24-alpine
  commands:
  - npm ci
  - npm run typecheck
  - npm run test:coverage
  - npm run build
  when:
    event:
    - push
    - pull_request

- name: docker
  image: plugins/docker
  settings:
    repo: registry.shaun-husain.com/simple-cam
    tags:
    - ${DRONE_BUILD_NUMBER}
    - latest
    registry: registry.shaun-husain.com
    dockerfile: Dockerfile
    insecure: true
    purge: false
  when:
    branch:
    - main
    event:
    - push

- name: kubectl_apply
  image: bitnami/kubectl:latest
  environment:
    KUBECONFIG: /.kube/config
  volumes:
  - name: kubeconfig
    path: /.kube/config
  commands:
  - NS="${K8S_NAMESPACE:-automation}"; kubectl get ns "$NS" || kubectl create ns "$NS"
  - kubectl apply -f k8s/
  - NS="${K8S_NAMESPACE:-automation}"; kubectl delete pod -n "$NS" -l app=simple-cam --wait=true
  - NS="${K8S_NAMESPACE:-automation}"; kubectl wait --for=condition=available deploy/simple-cam -n "$NS" --timeout=90s
  - NS="${K8S_NAMESPACE:-automation}"; kubectl get deploy,svc,ingress,pods -n "$NS" -o wide
  when:
    branch:
    - main
    event:
    - push

volumes:
- name: kubeconfig
  host:
    path: /home/shaun/.kube/config
